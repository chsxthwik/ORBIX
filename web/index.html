<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="ORBIX - a local-first AI coding workspace in your browser. Your agent asks before it changes files or runs commands.">
  <title>ORBIX</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/workspace.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Conversations"></aside>
    <div id="rs-side" class="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <main class="main">
      <div id="topbar" class="topbar"></div>
      <section id="welcome" class="welcome" aria-label="Home"></section>
      <section id="session" class="session" hidden></section>
    </main>
    <div id="rs-panel" class="resizer" role="separator" aria-orientation="vertical" aria-label="Resize side panel"></div>
    <aside id="panel" class="panel" aria-label="Side panel"></aside>
  </div>
  <footer id="statusbar" aria-label="Status"></footer>
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
