name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: ORBIX version
      description: Settings, About.
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: e.g. OpenRouter / some-model, or Ollama
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics or log
      description: Ctrl+K, Diagnostics. Remove anything private first. Never paste API keys.
      render: text
