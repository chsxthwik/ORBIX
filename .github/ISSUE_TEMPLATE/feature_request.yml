name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ORBIX to do?
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you tried
