name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; a newer push to the same branch cancels the run it replaces.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs (the tag in the comment), so a moved tag cannot change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm test
