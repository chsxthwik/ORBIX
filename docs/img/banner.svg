<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ORBIX - Unified ADE. A Windows desktop app where an AI agent works on your code and asks before it changes anything.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0920"/><stop offset="1" stop-color="#191560"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#6a5af9" stop-opacity="0.5"/><stop offset="1" stop-color="#6a5af9" stop-opacity="0"/></radialGradient><clipPath id="wmclip"><rect x="-5" y="0" width="190" height="40"/></clipPath></defs>
<rect width="1280" height="360" fill="url(#bg)"/>
<circle cx="230" cy="180" r="210" fill="url(#glow)"><animate attributeName="opacity" values=".65;1;.65" dur="6s" repeatCount="indefinite"/></circle>
<g transform="translate(230 180)" fill="none"><ellipse rx="175" ry="54" transform="rotate(-24)" stroke="#8f86ff" stroke-opacity=".4" stroke-width="1.5"/><ellipse rx="145" ry="145" stroke="#8f86ff" stroke-opacity=".18" stroke-dasharray="2 7"/>
<g transform="rotate(-24)"><circle r="6" fill="#8eeeff"><animateMotion dur="16s" repeatCount="indefinite" path="M-175 0A175 54 0 1 0 175 0A175 54 0 1 0 -175 0"/></circle></g></g>
<g transform="translate(142 92) scale(2.75)"><defs><linearGradient id="mt" x1="3" y1="3" x2="61" y2="61" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3a2fa6"/><stop offset=".6" stop-color="#1e1a6b"/><stop offset="1" stop-color="#110e40"/></linearGradient>
<linearGradient id="mr" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d9d3ff"/><stop offset="1" stop-color="#7a6cf9"/></linearGradient>
<linearGradient id="mo" x1="6" y1="40" x2="58" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#35aee6"/></linearGradient>
<clipPath id="mf"><rect x="-10" y="32" width="84" height="40"/></clipPath><clipPath id="mb"><rect x="-10" y="-10" width="84" height="42"/></clipPath>
<radialGradient id="mh"><stop offset="0" stop-color="#8f86ff" stop-opacity=".5"/><stop offset="1" stop-color="#8f86ff" stop-opacity="0"/></radialGradient></defs><rect x="3" y="3" width="58" height="58" rx="14" fill="url(#mt)"/><rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
<circle cx="32" cy="32" r="22" fill="url(#mh)"/>
<g transform="rotate(-32 32 32)"><g clip-path=""><g clip-path="url(#mb)"><ellipse cx="32" cy="32" rx="26.5" ry="9.5" fill="none" stroke="url(#mo)" stroke-width="3.6"/></g></g>
<circle cx="32" cy="32" r="17" fill="none" stroke="url(#mr)" stroke-width="6.5"/>
<g clip-path="url(#mf)"><ellipse cx="32" cy="32" rx="26.5" ry="9.5" fill="none" stroke="url(#mo)" stroke-width="3.6"/></g>
<circle cx="32" cy="32" r="4.2" fill="#fff"/>
<g transform="translate(32 32)"><circle r="3.9" fill="#8eeeff"><animateMotion dur="9s" repeatCount="indefinite" rotate="0" path="M-26.5 0A26.5 9.5 0 1 0 26.5 0A26.5 9.5 0 1 0 -26.5 0" begin="-2.4s"/></circle></g></g></g>
<g transform="translate(470 100) scale(1.95)"><g fill="none" stroke="#ffffff" stroke-width="7" clip-path="url(#wmclip)"><circle cx="20" cy="20" r="16.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.00;0.45;1" dur="2.4s" fill="freeze"/></circle><path d="M50.5 0V40M50.5 3.5H66a8.5 8.5 0 0 1 0 17H50.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.06;0.51;1" dur="2.4s" fill="freeze"/></path><path d="M63 22L77 40" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.12;0.57;1" dur="2.4s" fill="freeze"/></path><path d="M90.5 0V40M90.5 3.5H103a7 7 0 0 1 0 14H90.5M90.5 17.5H105a9.5 9.5 0 0 1 0 19H90.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.18;0.63;1" dur="2.4s" fill="freeze"/></path><path d="M128.5 0V40" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.24;0.69;1" dur="2.4s" fill="freeze"/></path><path d="M140.5 -2L174.5 42" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.30;0.75;1" dur="2.4s" fill="freeze"/></path><path d="M174.5 -2L140.5 42" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.36;0.81;1" dur="2.4s" fill="freeze"/></path></g></g>
<g font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">
<text x="474" y="218" font-size="21" font-weight="600" letter-spacing="9" fill="#59d6f5" opacity="0">UNIFIED ADE<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.7;1" dur="2.6s" fill="freeze"/></text>
<text x="474" y="268" font-size="22" fill="#ffffff" opacity="0">A Windows desktop app where an AI agent works on your code.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.6;.8;1" dur="3s" fill="freeze"/></text>
<text x="474" y="298" font-size="17" fill="#c9c7f0" opacity="0">It asks before it edits or runs anything, and every change can be undone.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.7;.9;1" dur="3.2s" fill="freeze"/></text></g></svg>
