<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ORBIX architecture: the native window talks to a local server, which runs the agent, which talks to model providers, tools and MCP servers">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C0C0D"/><stop offset="1" stop-color="#151518"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33D1BE"/></marker>
</defs>
<rect width="1280" height="560" rx="18" fill="url(#bg)"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">How ORBIX is built</text>
<text x="40" y="76" font-size="14" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Everything runs on your PC. Model requests go to the provider you choose.</text>
<!-- columns -->
<text x="40" y="128" font-size="12" letter-spacing="2" fill="#33D1BE" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">YOUR PC</text>
<rect x="30" y="140" width="800" height="380" rx="18" fill="#ECECE8" fill-opacity=".03" stroke="#33D1BE" stroke-opacity=".35" stroke-dasharray="4 6"/>
<rect x="56" y="170" width="200" height="130" rx="14" fill="#151518" stroke="#33D1BE" stroke-opacity=".55" stroke-width="1.5"/><rect x="56" y="170" width="6" height="130" rx="3" fill="#33D1BE"/><text x="80" y="202" font-size="17" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Window</text><text x="80" y="228" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">bin\ORBIX.exe (native)</text><text x="80" y="248" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">WebView2 shows web/:</text><text x="80" y="268" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">chat, cards, diffs</text>
<rect x="326" y="170" width="200" height="130" rx="14" fill="#151518" stroke="#33D1BE" stroke-opacity=".55" stroke-width="1.5"/><rect x="326" y="170" width="6" height="130" rx="3" fill="#33D1BE"/><text x="350" y="202" font-size="17" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Local server</text><text x="350" y="228" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">src/ (Node.js, bundled)</text><text x="350" y="248" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">127.0.0.1 only</text><text x="350" y="268" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Per-launch token</text>
<rect x="596" y="170" width="200" height="130" rx="14" fill="#151518" stroke="#33D1BE" stroke-opacity=".55" stroke-width="1.5"/><rect x="596" y="170" width="6" height="130" rx="3" fill="#33D1BE"/><text x="620" y="202" font-size="17" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Data folder</text><text x="620" y="228" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Chats and settings</text><text x="620" y="248" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Keys, encrypted</text><text x="620" y="268" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">(Windows DPAPI)</text>
<rect x="326" y="340" width="200" height="150" rx="14" fill="#151518" stroke="#FF9A5C" stroke-opacity=".55" stroke-width="1.5"/><rect x="326" y="340" width="6" height="150" rx="3" fill="#FF9A5C"/><text x="350" y="372" font-size="17" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">ORBIX agent</text><text x="350" y="398" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">The loop: model, tool,</text><text x="350" y="418" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">result, model...</text><text x="350" y="438" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Asks before write, edit</text><text x="350" y="458" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">and commands. Undo.</text>
<rect x="56" y="340" width="200" height="150" rx="14" fill="#151518" stroke="#33D1BE" stroke-opacity=".55" stroke-width="1.5"/><rect x="56" y="340" width="6" height="150" rx="3" fill="#33D1BE"/><text x="80" y="372" font-size="17" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Your project</text><text x="80" y="398" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Files, git, shell</text><text x="80" y="418" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Rules: AGENTS.md</text><text x="80" y="438" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Windows or WSL</text>
<rect x="596" y="340" width="200" height="150" rx="14" fill="#151518" stroke="#33D1BE" stroke-opacity=".55" stroke-width="1.5"/><rect x="596" y="340" width="6" height="150" rx="3" fill="#33D1BE"/><text x="620" y="372" font-size="17" font-weight="700" fill="#ECECE8" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">Tools</text><text x="620" y="398" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">read, write, edit</text><text x="620" y="418" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">bash, glob, grep</text><text x="620" y="438" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">web fetch, helper agents</text><text x="620" y="458" font-size="13" fill="#A3A39D" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">MCP servers, skills</text>
